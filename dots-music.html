      const ring = ctx.createRadialGradient(px, py, 0, px, py, R);
      ring.addColorStop(0, `hsla(${T.h},${T.s}%,${T.l + 12}%,${0.30 * flash})`);
      ring.addColorStop(0.5, `hsla(${T.h},${T.s}%,${T.l}%,${0.10 * flash})`);
      ring.addColorStop(1, `hsla(${T.h},${T.s}%,${T.l}%,0)`);
      ctx.fillStyle = ring;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
    }
    // ---- 碰撞闪光环（仅 bump 时）：一圈更紧、更亮的冲击环，读作"撞上了" ----
    if (bump > 0) {
      const R = rr * (2.2 + (1 - bump) * 2.6);           // 由内向外急冲
      const ring = ctx.createRadialGradient(px, py, R * 0.55, px, py, R);
      ring.addColorStop(0, `hsla(${T.h},${T.s}%,${Math.min(96, T.l + 30)}%,0)`);
      ring.addColorStop(0.7, `hsla(${T.h},${T.s}%,${Math.min(94, T.l + 22)}%,${(0.34 * bump).toFixed(3)})`);
      ring.addColorStop(1, `hsla(${T.h},${T.s}%,${T.l}%,0)`);
      ctx.fillStyle = ring;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  for (let bi = 0; bi < balls.length; bi++) {
    const b = balls[bi];
    const px = bp[bi].x;                                 // 与发光层用同一套水波位移，保证同心
    const py = bp[bi].y;
    const T = BALL_TONES[b.toneIdx % BALL_TONES.length];
    const rr = G.r * 0.50;                                  // 稍小一点（原 0.58）
    const lit = Math.max(Math.max(0, b.flash), Math.max(0, b.bump));
    const baseA = (lit > 0.15 ? 0.66 : 0.46) + lit * 0.18;  // 半透明主体（触发/碰撞时更实）
    // 主体：半透明玻璃珠 —— 顶部略亮、边缘更透，内芯保留一点实感
    const core = ctx.createRadialGradient(px - rr * 0.32, py - rr * 0.36, rr * 0.08, px, py, rr);
    core.addColorStop(0,    `hsla(${T.h},${T.s + 12}%,${Math.min(92, T.l + 24)}%,${Math.min(1, baseA + 0.10).toFixed(3)})`);
    core.addColorStop(0.55, `hsla(${T.h},${T.s}%,${T.l}%,${baseA.toFixed(3)})`);
    core.addColorStop(1,    `hsla(${T.h},${T.s}%,${Math.max(34, T.l - 12)}%,${(baseA * 0.55).toFixed(3)})`);
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
    // 边缘细环：勾勒出半透明感，避免糊成一团
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = `hsla(${T.h},${Math.min(60, T.s + 10)}%,${Math.min(94, T.l + 26)}%,${(lit > 0.15 ? 0.52 : 0.26).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(px, py, rr - 0.4, 0, Math.PI * 2); ctx.stroke();
  }
}

// ---- 拖拽涂抹音点：按下决定画笔模式（闭音/复音），拖动连续作用于经过的音点 ----
// pointerdown 落在某音点上 → 该点当前为激活 → 进入"闭音"画笔；当前为闭音 → 进入"复音"画笔。
// 拖动时同一模式贯穿始终，实现一次涂抹批量开关。
const flashMarks = [];               // 涂抹时的音点闪动标记
let paint = null;                    // { mode:'mute'|'unmute', last: 'c,r' }
function cellFromEvent(e) {
  const rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);
  const G = geo();
  // 超出网格区域（含半格容差）则不命中
  if (x < G.ox - G.cell * 0.5 || x > G.ox + G.gw + G.cell * 0.5) return null;
  if (y < G.oy - G.cell * 0.5 || y > G.oy + G.gh + G.cell * 0.5) return null;
  return { c: clampCol(x), r: clampRow(y) };
}
function applyPaint(cell, mode) {
  const k = wKey(cell.c, cell.r);
  const muted = walls.has(k);
  // 同步维护加速表（增量，避免整表重建）
  if (mode === 'mute' && !muted) { walls.add(k); wallFlags[k] = 1; return true; }
  if (mode === 'unmute' && muted) { walls.delete(k); wallFlags[k] = 0; return true; }
  return false;
}
cv.addEventListener('pointerdown', e => {
  const cell = cellFromEvent(e);
  if (!cell) return;
  // 以首个音点的当前状态决定画笔模式
  const mode = walls.has(wKey(cell.c, cell.r)) ? 'unmute' : 'mute';
  paint = { mode, last: wKey(cell.c, cell.r) };
  cv.setPointerCapture?.(e.pointerId);
  const changed = applyPaint(cell, mode);
  if (changed) { flashCell(cell); scheduleSave(); }
});
cv.addEventListener('pointermove', e => {
  if (!paint) return;
  const cell = cellFromEvent(e);
  if (!cell) return;
  const k = wKey(cell.c, cell.r);
  if (k === paint.last) return;        // 同一格不重复处理
  paint.last = k;
  const changed = applyPaint(cell, paint.mode);
  if (changed) flashCell(cell);
});
function endPaint() {
  if (!paint) return;
  paint = null;
  scheduleSave();            // 一次涂抹（可能跨很多格）结束后统一落盘
}
cv.addEventListener('pointerup', endPaint);
cv.addEventListener('pointercancel', endPaint);
cv.addEventListener('pointerleave', endPaint);
// 被涂抹的音点轻微闪动，给出即时反馈
function flashCell(cell) {
  flashMarks.push({ col: cell.c, row: cell.r, life: 0.4, dur: 0.4 });
}

// ---- UI ----
// 「声部」网格：6 个声部，每个 = 序号圆点 + 音高 + 速度。
//   圆点：激活 = 该声部小球的专属色、未激活 = 灰色。点击切换该声部自身的激活状态（点 3 只影响 3）。
//   音高：点击在 低→中→高 间循环（一个八度偏移）。
//   速度：点击在 1/16→1/8→1/4 间循环（每 X 分音符移动一格，数字越小越慢）。
const VOICE_REGS = ['low', 'mid', 'high'];
const VOICE_REG_TXT = { low: '低', mid: '中', high: '高' };
const VOICE_DIVS = [16, 8, 4];                     // 循环顺序：1/16 → 1/8 → 1/4
const VOICE_DIV_TXT = { 4: '1/4', 8: '1/8', 16: '1/16' };
function renderVoices() {
  const grid = document.getElementById('voiceGrid');
  if (!grid) return;
  let html = '';
  for (let i = 0; i < VOICE_N; i++) {
    const cfg = voiceCfg[i];
    const on = cfg.active;
    const T = ballTone(i);                           // 该声部小球色 → 整组 UI 的着色变量
    const toneStyle = `--vh:${T.h};--vs:${T.s}%;--vl:${T.l}%`;
    html += `<div class="voice${on ? ' on' : ''}" style="${toneStyle}">`
      + `<button class="vc" data-i="${i}" title="${on ? '声部 ' + (i + 1) + '（已激活，点击关闭）' : '点击激活声部 ' + (i + 1)}">${i + 1}</button>`
      + `<button class="vbtn" data-i="${i}" data-act="reg" title="音高：低/中/高（整体升降一个八度）${on ? '，点击切换' : '，点击可直接激活声部并设置'}"><b>${VOICE_REG_TXT[cfg.reg]}</b></button>`
      + `<button class="vbtn" data-i="${i}" data-act="div" title="速度：每 X 分音符移动一格，1/16 为默认${on ? '，点击切换' : '，点击可直接激活声部并设置'}"><b>${VOICE_DIV_TXT[cfg.div] || '1/16'}</b></button>`
      + `</div>`;
  }
  grid.innerHTML = html;
}
document.getElementById('voiceGrid').addEventListener('click', e => {
  const vc = e.target.closest('.vc');
  if (vc) {                                            // 点圆点 → 单独切换该声部的激活状态
    const i = +vc.dataset.i;
    voiceCfg[i].active = !voiceCfg[i].active;
    syncBalls();
    scheduleSave();
    return;
  }
  const vb = e.target.closest('.vbtn');
  if (!vb) return;
  const slot = +vb.dataset.i;
  const cfg = voiceCfg[slot];
  if (!cfg) return;
  // 未激活的声部：点音高/速度 = 顺带把它激活（关闭只能点圆点，避免误关）
  if (!cfg.active) cfg.active = true;
  if (vb.dataset.act === 'reg') {                      // 音高循环：低→中→高→低
    cfg.reg = VOICE_REGS[(VOICE_REGS.indexOf(cfg.reg) + 1) % VOICE_REGS.length];
  } else {                                             // 速度循环：1/16→1/8→1/4→1/16
    cfg.div = VOICE_DIVS[(VOICE_DIVS.indexOf(cfg.div || 16) + 1) % VOICE_DIVS.length];
  }
  syncBalls();                                         // 激活/配置变化 → 同步小球（新球会取用 cfg 的值）
  const b = balls.find(x => x.slot === slot);
  if (b) b.flash = 1;                                  // 闪一下给出即时反馈
  renderVoices();
  scheduleSave();
});
document.querySelectorAll('.chiprow').forEach(row => {
  row.addEventListener('click', e => {
    const btn = e.target.closest('.chip'); if (!btn) return;
    row.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    btn.classList.add('on');
    const k = row.dataset.key, v = btn.dataset.v;
    if (k === 'scale') { state.scale = v; rebuildPitches(true); }
    if (k === 'timbre') state.timbre = v;
    if (k === 'mode') { state.mode = v; resetBallMotion(); }
    if (k === 'density') { applyDensity(v); }
    scheduleSave();
  });
});
const tempoEl = document.getElementById('tempo'), tempoVal = document.getElementById('tempoVal');
tempoEl.addEventListener('input', () => {
  state.bpm = +tempoEl.value; tempoVal.textContent = state.bpm + ' BPM';
  // 延迟时间与 BPM 同步（8 分音符）。这里必须用 setTargetAtTime 平滑过渡：
  // 直接赋值会让延时线的读指针瞬间跳变 → 拖速度条时会听到"咔"的爆音。
  if (AC) delayNode.delayTime.setTargetAtTime(60 / state.bpm * 0.5, AC.currentTime, 0.05);
  scheduleSave();
});
const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', async () => {
  initAudio();
  if (AC.state === 'suspended') await AC.resume();
  playing = !playing;
  if (playing) resetClock();        // 起播：把第一个格点对齐到"当前时间 + 少量余量"
  else stepIndex = 0;               // 暂停：重置格点序号，下次起播从第 0 拍开始
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.classList.toggle('on', playing);
  if (playing) resumeLoop();          // 若此前因页面不可见停了主循环，这里立刻恢复
});

document.getElementById('shuffleBtn').addEventListener('click', shuffleAll);
document.getElementById('autoBtn').addEventListener('click', () => setAutoVariation(!autoVariation));

// ---- 会话记忆：退出后再进来，保持上一次的设置 ----
// 保存内容 = 全部「可调项」+ 当前变奏本身（音级布局与闭音分布），所以重新打开时
// 听到/看到的还是离开前那一段，而不是每次都被重置成出厂编排。
// 只存设置，不存播放态：浏览器策略不允许页面自动起播，音乐仍需手动点播放。
// v3：声部默认音高为「低/中/高」分层（发声 = 移动换格时在该音区奏响）。
const SESSION_KEY = 'dotseq.session.v3';
// v2 存档迁移：上一版声部音高只有一个默认值「高」（并非用户手调），
// 直接读回来会让三个声部挤在高音区、失去层次。所以迁移时只补这一项 ——
// 若存档里声部音高是清一色「高」，按新的分层默认还原；其余（调式/音色/轨迹/密度/
// BPM/声部激活与速度/变奏本身）原样沿用。用户手调过（存在非 high）则完全不动。
const LEGACY_SESSION_KEYS = ['dotseq.session.v2'];
let _saveTimer = 0;
// 恢复完成前禁止写档：boot 早期网格还没定稿，此刻写下去等于用"未恢复"的状态覆盖存档
let sessionReady = false;
let pendingVariation = null;                           // 待恢复的变奏（等布局稳定后再落地）
let _restoreHardTimer = 0;
const SESSION_TIMBRES = new Set(['pluck', 'bell', 'pad', 'bass']);
const SESSION_MODES = new Set(['drunk', 'line', 'circle', 'tri']);
const SESSION_REGS = new Set(['low', 'mid', 'high']);
const SESSION_DIVS = new Set([4, 8, 16]);
const sessNum = (v, lo, hi, dft) => (typeof v === 'number' && isFinite(v) && v >= lo && v <= hi) ? v : dft;

function collectSession() {
  return {
    v: 3,
    scale: state.scale, timbre: state.timbre, mode: state.mode,
    bpm: state.bpm, cell: targetCell,
    voices: voiceCfg.map(c => [c.active ? 1 : 0, c.reg, c.div]),
    autoVar: autoVariation ? 1 : 0,
    rows: ROWS, cols: COLS,
    slots: slotOf.length ? slotOf.map(r => r.slice()) : null,   // 音级布局（变奏）
    walls: [...walls],                                          // 闭音分布（键 = row*cols+col）
  };
}
function saveSessionNow() {
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = 0; }
  if (!sessionReady) return;
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(collectSession())); } catch (e) { /* 隐私模式/空间不足：静默降级 */ }
}
// 涂抹闭音、拖滑杆这类高频变更走防抖；页面隐藏/离开时再强制落盘一次
function scheduleSave() {
  if (!sessionReady) return;
  if (_saveTimer) return;
  _saveTimer = setTimeout(saveSessionNow, 400);
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.v === 3) return s;
    }
  } catch (e) { /* 存档解析失败：按"没有存档"处理 */ }
  for (const k of LEGACY_SESSION_KEYS) {
    try {
      const raw = localStorage.getItem(k);
      if (!raw) continue;
      const s = JSON.parse(raw);
      if (!s || s.v !== 2) continue;
      const allHigh = Array.isArray(s.voices) && s.voices.length === VOICE_N &&
        s.voices.every(v => Array.isArray(v) && v[1] === 'high');
      if (allHigh) s.voices = s.voices.map((v, i) => [v[0], DEFAULT_VOICE_CFG[i].reg, v[2]]);
      s.v = 3;
      return s;
    } catch (e) { /* 坏档忽略 */ }
  }
  return null;
}
function applySessionSettings(s) {
  if (typeof s.scale === 'string' && SCALES[s.scale]) state.scale = s.scale;
  if (SESSION_TIMBRES.has(s.timbre)) state.timbre = s.timbre;
  if (SESSION_MODES.has(s.mode)) state.mode = s.mode;
  state.bpm = sessNum(s.bpm, 40, 200, state.bpm);
  const cell = sessNum(s.cell, 20, 64, targetCell);
  targetCell = cell; state.cell = cell;
  if (Array.isArray(s.voices) && s.voices.length === VOICE_N) {
    for (let i = 0; i < VOICE_N; i++) {
      const v = s.voices[i];
      if (!Array.isArray(v)) continue;
      voiceCfg[i].active = (v[0] === 1 || v[0] === true);
      if (SESSION_REGS.has(v[1])) voiceCfg[i].reg = v[1];
      if (SESSION_DIVS.has(v[2])) voiceCfg[i].div = v[2];
    }
    if (!voiceCfg.some(c => c.active)) voiceCfg[0].active = true;   // 脏数据保护：至少留一个声部
  }
  autoVariation = (s.autoVar === 1);
  barStartStep = 0;
}
// 恢复变奏：舞台尺寸与保存时不同（行列数变了）→ 按归一化坐标重采样搬回新网格
function applySessionVariation(s) {
  if (!Array.isArray(s.slots) || !s.slots.length) return false;
  if (!(W > 0) || !(H > 0) || !(COLS > 0) || !(ROWS > 0)) return false;   // 尺寸未定稿 → 不能恢复
  const rows = sessNum(s.rows, 8, 64, 0), cols = sessNum(s.cols, 5, 64, 0);
  if (!rows || !cols) return false;
  if (s.slots.length !== rows || (s.slots[0] || []).length !== cols) return false;
  slotOf = s.slots.map(r => r.slice());
  walls.clear();
  if (Array.isArray(s.walls)) for (const k of s.walls) if (typeof k === 'number') walls.add(k);
  if (rows !== ROWS || cols !== COLS) resampleVariation(rows, cols);
  else syncWallFlags();
  rebuildPitches(true);
  updateField();
  syncBalls();
  return true;
}
// 把恢复后的状态回写到控件（选中态、滑杆、开关），否则 UI 与内部状态会对不上
function syncControlsUI() {
  document.querySelectorAll('.chiprow').forEach(row => {
    const k = row.dataset.key;
    const v = k === 'scale' ? state.scale
      : k === 'timbre' ? state.timbre
      : k === 'mode' ? state.mode
      : k === 'density' ? String(targetCell) : null;
    row.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.v === v));
  });
  const tEl = document.getElementById('tempo');
  tEl.value = state.bpm;
  document.getElementById('tempoVal').textContent = state.bpm + ' BPM';
  const ab = document.getElementById('autoBtn');
  ab.classList.toggle('on', autoVariation);
  ab.style.setProperty('--auto-p', '0%');
  renderVoices();
}
// 变奏的恢复时机：必须等舞台尺寸定稿。
// boot 早期（CSS 弹性高度/字体未就绪）算出的行列数往往与用户离开时不同，
// 此时恢复会被判成"尺寸变了"而做一次有损重采样 —— 闭音分布被揉散、甚至被压到最小网格。
// 所以这里等「尺寸连续两帧不变 + 字体已就绪」，最多 600ms；后台标签页 rAF 不跑，另设硬超时兜底。
function restoreVariationSoon() {
  const t0 = performance.now();
  let lastKey = '', stable = 0;
  const tick = () => {
    if (!pendingVariation) return;
    const key = W + 'x' + H;
    if (key === lastKey) stable++; else { stable = 0; lastKey = key; }
    const fontsOk = !document.fonts || document.fonts.status === 'loaded';
    if ((stable >= 2 && fontsOk) || performance.now() - t0 > 600) doRestoreVariation();
    else requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  _restoreHardTimer = setTimeout(doRestoreVariation, 900);
}
function doRestoreVariation() {
  if (_restoreHardTimer) { clearTimeout(_restoreHardTimer); _restoreHardTimer = 0; }
  if (!pendingVariation) return;                       // 已被取消（例如用户先手动生成了一段变奏）
  const s = pendingVariation;
  pendingVariation = null;
  const ok = applySessionVariation(s);
  if (!ok) shuffleAll();                               // 存档不可用 → 退回生成一段新变奏
  sessionReady = true;                                 // 此后才允许写档
  syncControlsUI();
}
// 卸载/切后台/关闭页面时补一次保存（防抖定时器可能还没到点）
window.addEventListener('pagehide', saveSessionNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveSessionNow(); });
window.addEventListener('beforeunload', saveSessionNow);
// 手机切后台再回来时，系统常把音频上下文挂起（suspended）→ 回来就"没声了"。
// 这里在重新可见时补一次 resume，避免用户以为坏了。
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && AC && AC.state === 'suspended') AC.resume();
});

// ---- boot ----
// 画布尺寸同步。注意：canvas 的 CSS 尺寸永远是舞台的 100%（position:absolute;inset:0），
// 因此内部坐标系 W/H 一旦与 CSS 尺寸不一致，浏览器就会非等比缩放位图 —— 正圆被压成椭圆。
// 所以这里以"舞台实际像素"为唯一依据，并在尺寸未变化时提前返回（避免 ResizeObserver 回环）。
let _lastW = -1, _lastH = -1;
function resize() {
  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  const changed = (w !== _lastW || h !== _lastH);
  _lastW = w; _lastH = h;
  W = w; H = h;
  // DPR 可能随系统缩放/浏览器缩放变化，跟随刷新；变化时清掉按旧 DPR 预渲染的点精灵
  const dpr = Math.min(devicePixelRatio || 1, DPR_CAP);
  if (dpr !== DPR) { DPR = dpr; clearSpriteCache(); }
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (!changed) return;                               // 尺寸没变 → 无需重算网格/音级
  // 舞台尺寸一变，格径就可能变 → 音点精灵是按固定基准半径预渲染的，必须整批重做
  clearSpriteCache();
  // 舞台尺寸变化 → 重新推算行列数（保持目标格径与统一间距）
  const oc = COLS, or_ = ROWS;
  computeGrid();
  const gridChanged = (oc !== COLS || or_ !== ROWS);
  if (gridChanged) {
    if (slotOf.length) {
      resampleVariation(or_, oc);                     // 已有变奏 → 按归一化坐标重采样，保持旋律
    } else {
      walls.clear();
      rebuildPitches(false);
      syncWallFlags();
    }
    rebuildPitches(true);
    clearSpriteCache();
  }
  updateField();
  // 尺寸变化后把声部重新吸附到网格坐标，避免落在区域外
  for (const b of balls) {
    b.col = Math.min(COLS - 1, Math.max(0, b.col));
    b.row = Math.min(ROWS - 1, Math.max(0, b.row));
    const G = geo(); b.x = G.cx(b.col); b.y = G.cy(b.row);
  }
  // 行列数变了 → 与切换密度同理：旧键解码会越界，轨迹参数也基于旧 FIELD，必须一起作废
  // （放在 updateField 与吸附之后，重置后的轨迹才是按新几何推导的）
  if (gridChanged) { dropGridTransients(true); scheduleSave(); }   // 键编码随行列数改变 → 落盘
  syncBalls();
}
window.addEventListener('resize', resize);
// 页面切到后台且未播放时，直接停掉主循环（看不见的画面没必要继续计算，省电）；
// 播放中不停 —— 音频调度依赖这个循环，停了音乐就会断。
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (!playing && rafId) { cancelAnimationFrame(rafId); rafId = 0; loopPaused = true; }
  } else if (loopPaused) {
    resumeLoop();
  }
});
// 关键补充：舞台高度会随下方选项区高度变化（声部网格换行、字体载入、系统栏收缩…），
// 这些都不会触发 window.resize，必须用 ResizeObserver 才能及时同步画布，否则圆会被拉成椭圆。
if (typeof ResizeObserver !== 'undefined') {
  let _roRaf = 0;
  const ro = new ResizeObserver(() => {
    if (_roRaf) return;
    _roRaf = requestAnimationFrame(() => { _roRaf = 0; resize(); });
  });
  ro.observe(document.getElementById('stage'));
}
// 先读回上一次的设置（含声部配置），再算网格/建球 —— 这样 syncBalls 直接按恢复后的配置创建声部
const _session = loadSession();
if (_session) applySessionSettings(_session);
computeGrid();
rebuildPitches();
resize();                                            // 末尾会 syncBalls() → renderVoices()
updateField();
syncControlsUI();                                    // 控件立刻反映恢复后的设置
if (_session && Array.isArray(_session.slots) && _session.slots.length) {
  pendingVariation = _session;                       // 变奏等布局定稿后再恢复（见 restoreVariationSoon）
  restoreVariationSoon();
} else {
  shuffleAll();                                      // 没有存档（或存档损坏）→ 生成一段新变奏
  sessionReady = true;
  saveSessionNow();                                  // 首次访问：把这段变奏也存下来，下次进来还是它
}
// 字体/图标载入后布局可能微调，再校准一次尺寸
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    clearSpriteCache();                 // 音名已烘焙进音点精灵 —— 字体就绪后必须重渲一次
    setTimeout(resize, 60);
  });
}
rafId = requestAnimationFrame(frame);
</script>
</body>
</html>
